name: JEV training safety
on:
  push:
    paths:
      - 'backend/jev-posttrain/**'
      - '.github/workflows/jev-training-safety.yml'
  pull_request:
    paths:
      - 'backend/jev-posttrain/**'
      - '.github/workflows/jev-training-safety.yml'
permissions:
  contents: read
jobs:
  regression-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install small data-test dependencies (no model or source calls)
        run: python -m pip install numpy==2.5.3 scikit-learn==1.9.1
      - name: Weighting, split leakage, regression selection and cutoff safeguards
        env:
          PYTHONPATH: backend/jev-posttrain
        run: python -m unittest discover -s backend/jev-posttrain -p 'test_*training*.py' -v
      - name: Check Python syntax
        run: python -m compileall -q backend/jev-posttrain
